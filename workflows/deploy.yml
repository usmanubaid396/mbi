    <!-- Interactive JavaScript -->
    <script>
        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileLinks = document.querySelectorAll('.mobile-link');

        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });

        // FAQ Accordion
        const faqToggles = document.querySelectorAll('.faq-toggle');
        faqToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const content = toggle.nextElementSibling;
                const icon = toggle.querySelector('span:last-child');
                
                // Close other accordions
                faqToggles.forEach(otherToggle => {
                    if (otherToggle !== toggle) {
                        otherToggle.nextElementSibling.classList.add('hidden');
                        otherToggle.querySelector('span:last-child').textContent = '+';
                        otherToggle.querySelector('span:last-child').style.transform = 'rotate(0deg)';
                    }
                });

                content.classList.toggle('hidden');
                if (content.classList.contains('hidden')) {
                    icon.textContent = '+';
                } else {
                    icon.textContent = '−';
                }
            });
        });

        // Contact Form Submission Handler (No alert())
        const contactForm = document.getElementById('contact-form');
        const formSuccess = document.getElementById('form-success');

        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            formSuccess.classList.remove('hidden');
            contactForm.reset();
            setTimeout(() => {
                formSuccess.classList.add('hidden');
            }, 6000);
        });

        // Interactive Project Row Click Simulation
        const projectCards = document.querySelectorAll('.project-card');
        projectCards.forEach(card => {
            card.addEventListener('click', () => {
                const projectNum = card.getAttribute('data-project');
                const title = card.querySelector('h3').textContent;
                // Smooth scroll to contact with pre-filled context or simulated view
                const contactSection = document.getElementById('contact');
                contactSection.scrollIntoView({ behavior: 'smooth' });
                const messageBox = contactForm.querySelector('textarea');
                messageBox.value = "Hi Muhammad, I'm interested in discussing your case study on " + title + " and how we can achieve similar results for my brand.";
            });
        });
    </script>
